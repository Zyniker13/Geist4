name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - name: Install the cmark reference binary (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmark
      - name: Install the cmark reference binary (macOS)
        if: runner.os == 'macOS'
        run: brew install cmark
      - name: Cache the cargo-deny advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-dbs
          # One key across operating systems: the database is a plain git
          # repository of TOML files, so any runner's save warms every
          # other runner, and a runner whose fetch keeps failing still
          # gets a warm copy from the others.
          key: advisory-db-2026-11
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Run check.sh
        shell: bash
        run: |
          bash scripts/check.sh 2>&1 | tee check.log
          exit "${PIPESTATUS[0]}"
      - name: Upload the check log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-${{ matrix.os }}
          path: check.log

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0
      - name: Build (MSRV)
        run: cargo build --workspace

  instructions:
    name: Instruction-count gate
    runs-on: ubuntu-latest
    # TEMP diagnostic only: statuses:write posts the log tail for offline
    # reading; removed once the baseline is captured.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind && valgrind --version
      - name: Check the runner version matches Cargo.lock
        run: |
          lock=$(python3 -c "import re;s=open('Cargo.lock').read();m=re.search(r'name = \"iai-callgrind\"\\nversion = \"([^\"]+)\"',s);print(m.group(1))")
          echo "iai-callgrind in Cargo.lock: $lock"
          [ "$lock" = "0.14.2" ] || { echo "the runner is pinned to 0.14.2; update both together"; exit 1; }
      - name: Install iai-callgrind-runner
        run: cargo install --locked iai-callgrind-runner@0.14.2
      - name: Run the instruction-count benchmarks
        run: |
          set -o pipefail
          cargo bench -p geist4-bench --bench iai 2>&1 | tee iai.log
          code=$?
          {
            echo "BENCH_EXIT=$code"
            echo "--- target/iai files:"
            find target/iai -type f 2>/dev/null | head -20
            echo "--- target/criterion iai:"
            ls target/release/deps/iai-* 2>/dev/null | head -5
          } >> iai.log
          exit "$code"
      - name: Check the counts against the baseline
        run: python3 tools/check_iai.py iai.log bench/iai-baseline.txt
      - name: TEMP diagnostic — post the iai log tail as commit statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base64 -i iai.log | tr -d '\n' > iai-b64.txt
          mapfile -t chunks < <(fold -w 130 iai-b64.txt)
          for i in "${!chunks[@]}"; do
            gh api "repos/$GH_REPO/statuses/${{ github.sha }}" \
              -f state=success -f context="iai-$((i+1))" -f description="${chunks[$i]}" > /dev/null
          done
          echo "posted ${#chunks[@]} statuses"
      - name: Upload the instruction-count log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iai-log
          path: iai.log
