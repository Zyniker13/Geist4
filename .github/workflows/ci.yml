name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - name: Install the cmark reference binary (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmark
      - name: Install the cmark reference binary (macOS)
        if: runner.os == 'macOS'
        run: brew install cmark
      - name: Cache the cargo-deny advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-dbs
          # One key across operating systems: the database is a plain git
          # repository of TOML files, so any runner's save warms every
          # other runner, and a runner whose fetch keeps failing still
          # gets a warm copy from the others.
          key: advisory-db-2026-11
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Install cbindgen
        # The version the checked-in header was generated with; bump both
        # together and regenerate crates/geist4-ffi/include/geist4.h.
        run: cargo install --locked cbindgen@0.29.0
      - name: Install wasm-bindgen-cli and the wasm target
        # The versions the checked-in glue was generated with; the CLI and
        # crate must stay paired (decision 0029), and bump both together.
        run: |
          cargo install --locked wasm-bindgen-cli@0.2.130
          rustup target add wasm32-unknown-unknown
      - name: Install binaryen (macOS)
        # check.sh post-processes the wasm with `wasm-opt -Oz --strip-debug`
        # (decision 0029); any current version fits the size budget.
        if: runner.os == 'macOS'
        run: brew install binaryen
      - name: Install binaryen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
      - name: Download binaryen (Windows)
        # The official release tarball, pinned with the checksum the
        # project publishes for it — bump the version and the checksum
        # together. (Chocolatey's binaryen package is third-party; the
        # release tarball is the project's own artifact.)
        if: runner.os == 'Windows'
        shell: bash
        run: curl -sSLo binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-windows.tar.gz
      - name: Verify the binaryen checksum (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "17a2cbeac6b5693c5fbafab3838d3c65fd9c1eb38b05f5baec6c657e8c84995b  binaryen.tar.gz" | sha256sum -c -
      - name: Extract binaryen (Windows)
        # Only bin/ is needed (wasm-opt.exe). The tarball also carries a
        # ~470 MB lib/binaryen.lib that nothing here uses; extracting only
        # bin/ keeps the extract small and fast.
        #
        # GNU tar in Git Bash fails to chdir to a backslash drive path
        # (D:\a\_temp/x: Cannot open: No such file or directory), so every
        # path is resolved to POSIX form with cygpath before tar sees it.
        # Fallbacks, in order: tar with cd instead of -C, then the
        # System32 bsdtar with native paths. Annotations keep a failure
        # diagnosable without a token; GitHub caps them at 10 per step.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TEMP_POSIX="$(cygpath -u "$RUNNER_TEMP")"
          WS_POSIX="$(cygpath -u "$GITHUB_WORKSPACE")"
          BINARYEN_DIR="$TEMP_POSIX/binaryen"
          ARCHIVE="$WS_POSIX/binaryen.tar.gz"
          echo "::warning::temp-posix=$TEMP_POSIX archive-bytes=$(wc -c < binaryen.tar.gz)"

          rm -rf "$BINARYEN_DIR"
          mkdir -p "$BINARYEN_DIR"
          test -d "$BINARYEN_DIR" && dir_ok=yes || dir_ok=no
          echo "::warning::mkdir-dir-ok=$dir_ok"

          ok=0
          set +e
          tar -xzf "$ARCHIVE" -C "$BINARYEN_DIR" --strip-components=1 binaryen-version_133/bin > "$TEMP_POSIX/extract.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then ok=1; fi
          echo "::warning::extract-posix-C-exit=$rc"
          if [ "$ok" -ne 1 ]; then
            (
              cd "$BINARYEN_DIR" &&
              tar -xzf "$ARCHIVE" --strip-components=1 binaryen-version_133/bin
            ) > "$TEMP_POSIX/extract-cd.log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then ok=1; fi
            echo "::warning::extract-cd-exit=$rc"
          fi
          if [ "$ok" -ne 1 ]; then
            (
              cd "$BINARYEN_DIR" &&
              MSYS2_ARG_CONV_EXCL='*' /c/Windows/System32/tar.exe -xzf "$RUNNER_TEMP/binaryen.tar.gz" --strip-components=1 binaryen-version_133/bin
            ) > "$TEMP_POSIX/extract-bsdtar.log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then ok=1; fi
            echo "::warning::extract-system32-bsdtar-exit=$rc"
          fi
          set -e
          if [ "$ok" -ne 1 ]; then
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              if [ "$n" -le 4 ]; then echo "::warning::extract-error$n=$line"; fi
            done < "$TEMP_POSIX/extract.log"
            echo "::warning::system32-tar-present=$(command -v /c/Windows/System32/tar.exe >/dev/null 2>&1 && echo yes || echo no)"
            exit 1
          fi
          ls "$BINARYEN_DIR/bin"
          test -f "$BINARYEN_DIR/bin/wasm-opt.exe"
      - name: Put wasm-opt on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="$(cygpath -u "$RUNNER_TEMP")/binaryen/bin"
          ls "$BIN"
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          "$BIN/wasm-opt.exe" --version
      - name: Install maturin
        # The version the Python wheel build is pinned to; the Python
        # contract suite runs against the wheel it produces (decision 0034).
        run: cargo install --locked maturin@1.16.0
      - name: Run check.sh
        shell: bash
        run: |
          bash scripts/check.sh 2>&1 | tee check.log
          exit "${PIPESTATUS[0]}"
      - name: Upload the check log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-log-${{ matrix.os }}
          path: check.log

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0
      - name: Build (MSRV)
        run: cargo build --workspace

  instructions:
    name: Instruction-count gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind && valgrind --version
      - name: Check the runner version matches Cargo.lock
        run: |
          lock=$(python3 -c "import re;s=open('Cargo.lock').read();m=re.search(r'name = \"iai-callgrind\"\\nversion = \"([^\"]+)\"',s);print(m.group(1))")
          echo "iai-callgrind in Cargo.lock: $lock"
          [ "$lock" = "0.14.2" ] || { echo "the runner is pinned to 0.14.2; update both together"; exit 1; }
      - name: Install iai-callgrind-runner
        run: cargo install --locked iai-callgrind-runner@0.14.2
      - name: Run the instruction-count benchmarks
        # -j 2: runs at the default parallelism were killed mid-compile.
        run: |
          CARGO_BUILD_JOBS=2 cargo bench -p geist4-bench --bench iai > iai.log 2>&1
          code=$?
          tail -40 iai.log
          exit "$code"
      - name: Check the counts against the baseline
        run: python3 tools/check_iai.py iai.log bench/iai-baseline.txt
      - name: Upload the instruction-count log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iai-log
          path: iai.log
