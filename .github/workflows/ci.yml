name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      - uses: taiki-e/install-action@d2ed1e2aac453a580475b2b07db12bde0d5b18a2
        with:
          tool: cargo-deny@2.90.3
      - name: Run check.sh
        run: bash scripts/check.sh

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.85.0"
      - uses: taiki-e/install-action@d2ed1e2aac453a580475b2b07db12bde0d5b18a2
        with:
          tool: cargo-deny@2.90.3
      - name: Build (MSRV)
        run: cargo build --workspace
