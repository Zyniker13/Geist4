name: Fuzz

# A short smoke fuzz run per target. The long runs (an hour per target)
# happen locally after each milestone; this workflow's job is to catch
# easy crashes on every push using the seeded corpus.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [to_html, parse_document]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Seed the corpus from the checked-in seeds
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp seeds/${{ matrix.target }}/* corpus/${{ matrix.target }}/
      - name: Run (3 minutes)
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=180 -max_len=4096
