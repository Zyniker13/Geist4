# Temporary diagnostic workflow: posts the full Windows check.sh log as
# commit statuses (the job-log endpoints need admin; commit statuses are
# public). Remove after the failure is diagnosed.
name: Diag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  windows:
    name: Diag windows check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Install cbindgen
        run: cargo install --locked cbindgen@0.29.0
      - name: Install wasm-bindgen-cli and the wasm target
        run: |
          cargo install --locked wasm-bindgen-cli@0.2.130
          rustup target add wasm32-unknown-unknown
      - name: Run check.sh
        shell: bash
        run: |
          bash scripts/check.sh > check.log 2>&1 || true
          echo "EXIT=$?"
          tail -60 check.log
      - name: Post the log tail
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          n=0
          tail -c 3000 check.log |
          grep -vE "^\s*$" |
          sed 's/"/\\"/g' |
          fold -w 130 |
          while IFS= read -r line; do
            n=$((n+1))
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/$SHA" \
              -d "{\"state\":\"success\",\"context\":\"diag/win-$n\",\"description\":\"$line\"}" \
              -o /dev/null
          done
