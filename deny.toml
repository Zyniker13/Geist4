# Configuration for `cargo deny check` (run by scripts/check.sh and CI):
# licenses, security advisories, banned and duplicated crates, and sources.

[graph]
all-features = true

[licenses]
version = 2
# Everything the engine is built from must be permissively licensed, so the
# engine can ship under MIT OR Apache-2.0 (see docs/decisions/0001).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
