# Configuration for `cargo deny check` (run by scripts/check.sh and CI):
# licenses, security advisories, banned and duplicated crates, and sources.

[graph]
all-features = true

[licenses]
version = 2
# Everything the engine is built from must be permissively licensed, so the
# engine can ship under MIT OR Apache-2.0 (see docs/decisions/0001).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0173: proc-macro-error2 is unmaintained. It reaches only
    # the iai-callgrind benchmark macro (a dev-dependency of the benchmark
    # crate), is compile-time-only, and no vulnerable code ships in any
    # geist4 artifact. Revisit when iai-callgrind migrates off it.
    "RUSTSEC-2026-0173",
    # RUSTSEC-2025-0141: bincode 1.x development ceased after a harassment
    # incident; 1.3.3 is declared complete by its authors. It is used only
    # by iai-callgrind to store saved baselines in the benchmark crate,
    # never in geist4 artifacts. Revisit on an iai-callgrind upgrade.
    "RUSTSEC-2025-0141",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
