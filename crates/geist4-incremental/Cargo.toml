[package]
name = "geist4-incremental"
description = "Incremental reparsing for editor use: update a parsed document for an edited source, reusing the unchanged blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dev-dependencies]
geist4-ext = { path = "../geist4-ext" }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "update"
harness = false

[dependencies]
geist4-core = { path = "../geist4-core" }
