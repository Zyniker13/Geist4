[package]
name = "geist4-ffi"
description = "Stable C-compatible API for the Geist4 Markdown engine, the base for native bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

# This crate is the one place in the workspace where `unsafe` is allowed:
# every extern "C" entry point must hand out pointers, and the document
# handle must keep its input alive. The unsafe is confined to the handle
# plumbing and the panic boundary; see decision 0028.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
geist4-core = { path = "../geist4-core" }
geist4-ext = { path = "../geist4-ext" }
serde_json = { version = "1", default-features = false, features = ["std"] }
geist4-highlight = { path = "../geist4-highlight", optional = true }

[features]
default = ["highlight"]
# The syntect engine behind `enable_highlighting`. Off in the wasm
# build (the syntax pack is ~1.5 MiB, four times the wasm size budget,
# decision 0044); the method stays and reports through the error path
# when built without it.
highlight = ["dep:geist4-highlight"]
