[package]
name = "geist4-ext-loader"
description = "Loads Geist4 extensions in the standard format, including the WebAssembly sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# The WebAssembly sandbox (tier 2). Off by default so the core and the
# bindings stay small; the CLI enables it.
sandbox = ["dep:wasmtime"]

[dependencies]
geist4-core = { path = "../geist4-core" }
toml = "1.2.1"
serde = { version = "1", features = ["derive"] }
wasmtime = { version = "51.0.0", optional = true, default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
] }
