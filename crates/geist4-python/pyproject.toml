[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "geist4"
description = "Geist4: a CommonMark-conformant Markdown engine, native Python binding"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "geist4._geist4"
features = ["pyo3/extension-module"]
