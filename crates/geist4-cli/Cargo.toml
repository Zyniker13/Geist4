[package]
name = "geist4-cli"
description = "The Geist4 command-line tool: render, check, ast, format, ext check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "geist4"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
geist4-core = { path = "../geist4-core" }
geist4-ext-loader = { path = "../geist4-ext-loader", features = ["sandbox"] }
geist4-spec-harness = { path = "../geist4-spec-harness" }
