[workspace]
resolver = "3"
members = [
    "crates/geist4-core",
    "crates/geist4-html",
    "crates/geist4-ext",
    "crates/geist4-ext-loader",
    "crates/geist4-cli",
    "crates/geist4-ffi",
    "crates/geist4-wasm",
    "crates/geist4-python",
    "crates/geist4-spec-harness",
    "crates/geist4-mdast",
    "crates/geist4-writer",
    "crates/geist4-json",
    "crates/geist4-bench",
]
# The fuzz crate builds with nightly instrumentation flags and must not
# join the workspace (it would drag libfuzzer into deny checks and
# release builds).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zyniker13/Geist4"
rust-version = "1.85.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# Release artifacts (the .wasm, the C static library, the Python wheel)
# build with fat LTO and one codegen unit: smaller code, better inlining.
# panic stays "unwind": catch_unwind is part of the C ABI and host-hook
# error contract. The .wasm additionally shrinks through wasm-opt -Oz
# --strip-debug in scripts/check.sh; decision 0029 records that step and
# the size budget it serves.
[profile.release]
lto = true
codegen-units = 1
