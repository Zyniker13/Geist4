# cargo-mutants configuration for Geist4.
#
# Machine-safety limits: some parser-loop mutants hang forever and a few
# grow memory without bound (tens of GB observed on 2026-11-20). A short
# per-mutant timeout and a 20 s minimum keep runs bounded, and the exclude
# list drops the known hang class, which cargo-mutants would otherwise
# only report as timeouts (no kill-signal loss).
# Job count is capped at 2 by the cargo-mutants guard wrapper on the build
# machine (cargo-mutants 27.1.0 has no `jobs` config key).
