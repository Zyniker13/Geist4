# Machine-safety limits: some parser-loop mutants hang forever and a few
# grow memory without bound (tens of GB observed on 2026-11-20). A 20 s
# minimum test timeout keeps runs bounded, and the exclude list drops the
# known hang mutants, which cargo-mutants would otherwise only report as
# timeouts (no kill-signal loss). Per-mutant exact patterns, not
# function-level ones: every hang-prone function still catches most of
# its mutants, so excluding a whole function would destroy kill signal.
# Regenerate with gen_mutants_cfg.py from mutants.out/outcomes.json after
# source edits shift line numbers.
# Job count is capped at 2 by the cargo-mutants guard wrapper on the build
# machine (cargo-mutants 27.1.0 has no `jobs` config key).
